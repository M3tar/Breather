<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Breather — 安静自然的 macOS 休息提醒</title>
  <desc id="desc">Breather 用安静的菜单栏计时和明确的全屏休息，让专注与休息保持自然节奏。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf8ff"/>
      <stop offset="0.58" stop-color="#f5fbfa"/>
      <stop offset="1" stop-color="#e9f8f1"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66c9b0"/>
      <stop offset="1" stop-color="#2c9c83"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8ddf7"/>
      <stop offset="1" stop-color="#78b4e2"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="32" fill="url(#sky)"/>
  <path d="M0 320C95 286 165 303 237 338C307 372 392 371 468 337C550 301 625 291 714 329C806 368 894 359 973 323C1053 286 1122 286 1200 316V400H0Z" fill="#d8efe8" opacity=".72"/>
  <path d="M0 354C90 332 178 347 250 371C344 402 422 380 505 350C590 319 668 326 748 361C824 394 901 391 987 356C1060 326 1136 330 1200 350V400H0Z" fill="#c3e4dd" opacity=".58"/>
  <circle cx="1038" cy="76" r="44" fill="#ffffff" opacity=".55"/>
  <circle cx="1038" cy="76" r="31" fill="#dbeafb" opacity=".8"/>

  <g id="title-block" transform="translate(64 52)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(0 2)">
      <rect width="54" height="54" rx="15" fill="url(#blue)"/>
      <path d="M17 38C9 27 18 14 33 14C45 14 46 27 39 31C34 34 28 31 27 27C25 38 18 43 17 38Z" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <text x="72" y="19" fill="#55777a" font-size="18" font-weight="650" letter-spacing="2.2">MACOS 菜单栏休息提醒</text>
    <text x="0" y="138" fill="#173f43" font-size="78" font-weight="760" letter-spacing="-2">Breather</text>
    <text x="2" y="185" fill="#365d60" font-size="27" font-weight="560">专注很重要，休息也同样重要。</text>
    <text x="2" y="222" fill="#5c7779" font-size="22">在繁忙工作中，记得像呼吸一样自然地休息。</text>

    <g transform="translate(2 265)" font-size="18" font-weight="650">
      <rect width="138" height="38" rx="19" fill="#d7f1e9"/>
      <circle cx="23" cy="19" r="6" fill="#32a78a"/>
      <text x="39" y="25" fill="#276f62">macOS 15+</text>
      <rect x="150" width="236" height="38" rx="19" fill="#e2f0fb"/>
      <text x="171" y="25" fill="#376986">Apple 芯片 + Intel</text>
    </g>
  </g>

  <g id="breathing-rhythm" transform="translate(730 52)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <circle cx="205" cy="148" r="132" fill="#fff" opacity=".48"/>
    <circle cx="205" cy="148" r="98" fill="none" stroke="#82c9b8" stroke-width="2" opacity=".34"/>
    <circle cx="205" cy="148" r="70" fill="#72c9b3" opacity=".13" filter="url(#soft)"/>
    <rect x="160" y="103" width="90" height="90" rx="25" transform="rotate(45 205 148)" fill="url(#jade)"/>
    <rect x="178" y="121" width="54" height="54" rx="16" transform="rotate(45 205 148)" fill="#f7fffc" opacity=".32"/>

    <path d="M75 148A130 130 0 0 1 174 22" fill="none" stroke="#66bba7" stroke-width="7" stroke-linecap="round"/>
    <path d="M236 274A130 130 0 0 0 335 148" fill="none" stroke="#8bbfe6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="76" cy="148" r="7" fill="#2e9d84"/>
    <circle cx="334" cy="148" r="7" fill="#73aeda"/>

    <g transform="translate(0 264)">
      <rect width="170" height="54" rx="18" fill="#ffffff" opacity=".82"/>
      <text x="20" y="22" fill="#628084" font-size="16" font-weight="700" letter-spacing="1.4">专注</text>
      <text x="96" y="37" fill="#183f43" font-size="28" font-weight="680">25:55</text>
      <path d="M184 27H217" stroke="#78adac" stroke-width="2" stroke-linecap="round"/>
      <path d="M207 19L217 27L207 35" fill="none" stroke="#78adac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="232" width="170" height="54" rx="18" fill="#ffffff" opacity=".82"/>
      <text x="252" y="22" fill="#628084" font-size="16" font-weight="700" letter-spacing="1.4">休息</text>
      <text x="328" y="37" fill="#183f43" font-size="28" font-weight="680">00:28</text>
    </g>
  </g>
</svg>
